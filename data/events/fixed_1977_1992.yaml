  narrative: 利库德首次胜选，但缺乏外交与国际声望。贝京邀请工党名单当选的摩西·达扬出任外长；达扬的条件是在和平谈判期间不对约旦河西岸宣布主权。工党将达扬开除，指其"叛变"。
