  - group: group_1
    label: 利库德基层
    text: 我们等了29年，第一个重要职位却给了"他们的人"。
  - group: group_2
    label: 工党
    text: 达扬用赎罪日战争的污点换来了政治复活。
  - group: group_3
    label: 华盛顿
    text: 一个独眼将军坐在外交部，至少意味着新政府有一个他们认识的人。
  notes: 达扬坐在议会时以独立议员身份存在，劳工党对其的敌意会体现在 盟党满意度 计算之外的 选民集团支持[劳工派阿什肯纳兹] −2。
