  background: 老城被占领后的第一个夜晚，在耶路撒冷市长科莱克等人推动下，推土机拆除了哭墙前的穆格拉比区（约135座房屋、600余名居民），为哭墙前开辟广场；一名老年妇女死于瓦砾中。政府事后才追认这一行动，居民得到少量补偿。
  narrative: 老城被占领后的第一个夜晚，在耶路撒冷市长科莱克等人推动下，推土机拆除了哭墙前的穆格拉比区（约135座房屋、600余名居民），为哭墙前开辟广场；一名老年妇女死于瓦砾中。政府事后才追认这一行动，居民得到少量补偿。
  summary: 老城被占领后的第一个夜晚，在耶路撒冷市长科莱克等人推动下，推土机拆除了哭墙前。
  passive_effects:
  - op: set_flag
    flag: western_wall_plaza_cleared
  - op: add
    target: bloc_support
    value: 5.0
    key: religious_zionist
  - op: add
    target: bloc_support
    value: 3.0
    key: haredi
  - op: add
    target: religious_status_quo
