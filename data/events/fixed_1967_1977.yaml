  - op: add
    target: intl_legitimacy
    value: -2.0
  - op: add
    target: rule_of_law
    value: -1.0
  - op: schedule_event
    event: E-1967-01c
    delay_days: 30
  - op: schedule_event
    event: E-1967-02
    delay_days: 30
  perspectives:
  - group: group_1
    label: 犹太民众
    text: 十九年无法到达的哭墙前，第一次能容纳数十万人祈祷。
  - group: group_2
    label: 穆格拉比区居民
    text: 几个小时内被叫出家门，家族居住数百年的街区一夜消失。
  - group: group_3
    label: 市政官员
    text: 认为只有趁战争的窗口才能完成，“和平时期永远做不成”。
