  background: 1955年9月，纳赛尔宣布从捷克斯洛伐克（实为苏联）购入大批米格战机、坦克和火炮，数量远超以色列全部装备。11月本-古里安重任总理时，总参谋部估计军力平衡将在一年内彻底倒向埃及。
  narrative: 1955年9月，纳赛尔宣布从捷克斯洛伐克（实为苏联）购入大批米格战机、坦克和火炮，数量远超以色列全部装备。11月本-古里安重任总理时，总参谋部估计军力平衡将在一年内彻底倒向埃及。
  summary: 1955年9月，纳赛尔宣布从捷克斯洛伐克（实为苏联）购入大批米格战机、坦克和。
