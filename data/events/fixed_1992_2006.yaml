  background: 1993年8月，双方在奥斯陆草签《临时自治安排原则宣言》。9月9日，以色列与巴解交换相互承认信函，阿拉法特承诺放弃恐怖主义并承认以色列生存权。9月13日在白宫草坪签署，拉宾与阿拉法特握手。宣言规定先从加沙和杰里科撤出，五年过渡期，耶路撒冷、难民、定居点、边界留待最终地位谈判。议会以61票对50票（8票弃权）批准。
