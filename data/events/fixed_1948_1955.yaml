  perspectives:
  - group: group_1
    label: 政府
    text: 停火期间运进武器本身就违反停火协定，如果一支私人武装可以自己进口武器，国家就不存在。
  - group: group_2
    label: 伊尔贡成员
    text: 他们刚把武器和兵员交给新军队，却在海滩上被犹太人的炮火击中；许多人认为这是马帕伊对政敌的清算。
  - group: group_3
    label: 帕尔马赫士兵
    text: 很多人亲手执行了开火命令，这件事在他们之间也留下了长久的沉默。
  notes: 拉宾当时在特拉维夫海滩的帕尔马赫指挥部。
