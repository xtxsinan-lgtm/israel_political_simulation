  background: 1948年5月14日下午，本-古里安在特拉维夫博物馆宣读《独立宣言》，英国委任统治于午夜结束。次日，埃及、外约旦、叙利亚、伊拉克的军队和黎巴嫩部队进入原委任统治地区，内战阶段（1947-11起）转入国家间战争。美国在数分钟后给予事实承认，苏联在三天后给予法律承认。
  narrative: 1948年5月14日下午，本-古里安在特拉维夫博物馆宣读《独立宣言》，英国委任统治于午夜结束。次日，埃及、外约旦、叙利亚、伊拉克的军队和黎巴嫩部队进入原委任统治地区，内战阶段（1947-11起）转入国家间战争。美国在数分钟后给予事实承认，苏联在三天后给予法律承认。
  summary: 1948年5月14日下午，本-古里安在特拉维夫博物馆宣读《独立宣言》，英国委。
