  - group: group_2
    label: 吕大居民
    text: 被驱逐者的长队中有日后的人阵领导人乔治·哈巴什，这段步行成为巴勒斯坦民族记忆的核心场景之一。
  - group: group_3
    label: 内阁中的马帕姆部长
    text: 齐斯林等人质问"谁下的命令"，这个问题此后在内阁和史学界争论了数十年。
  notes: 书面驱逐令由行动司令部发出。本-古里安是否口头授意，源于拉宾回忆录中曾被审查删去的段落，史学界有争议，事件文本不作定论。
