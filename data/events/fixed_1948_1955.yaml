  background: 第一次停火于7月8日结束。在打通特拉维夫至耶路撒冷通道的"达尼行动"中，国防军于7月11–12日占领吕大和拉姆勒。吕大城内一次交火后，部队向人群和一座清真寺开火，死亡人数估计从约百人到二百五十人以上不等。7月12–13日，两城约5万至7万居民被驱逐，在盛夏步行走向阿拉伯军团防线，途中有人死于酷热和脱水。
