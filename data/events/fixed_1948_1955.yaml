  perspectives:
  - group: group_1
    label: 伊休夫犹太人
    text: 大屠杀刚过去三年，人们相信这是一场决定民族存亡的战争；约1%的犹太人口将在战争中死去。
  - group: group_2
    label: 巴勒斯坦阿拉伯人
    text: 内战阶段已有数十万人逃离或被驱逐，新国家的诞生在他们的记忆中是"大灾难"（纳克巴）的开端。
  - group: group_3
    label: 阿拉伯国家政府
    text: 出兵既出于泛阿拉伯的民意压力，也出于彼此的争夺，外约旦的阿卜杜拉与其余各国互不信任。
  notes: 开局时已发生的事（代尔亚辛、海法与雅法的人口外逃）以初始数值体现：土地怨气[阿拉伯人] 初始 40，巴勒斯坦民间敌意 初始 75。
