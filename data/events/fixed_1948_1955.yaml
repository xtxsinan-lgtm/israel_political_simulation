  background: 作战计划要求夺取吕大和拉姆勒。两城连同涌入的难民共约5万至7万人，紧邻机场与通往耶路撒冷的公路，阿拉伯军团就在附近，而国防军兵力吃紧。指挥官们问：占领之后，居民怎么办？史实上，政府没有就城镇居民下达书面政策，处置权实际上留给了战地指挥官。
  narrative: 作战计划要求夺取吕大和拉姆勒。两城连同涌入的难民共约5万至7万人，紧邻机场与通往耶路撒冷的公路，阿拉伯军团就在附近，而国防军兵力吃紧。指挥官们问：占领之后，居民怎么办？史实上，政府没有就城镇居民下达书面政策，处置权实际上留给了战地指挥官。
