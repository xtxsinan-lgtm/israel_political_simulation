<!-- 1920x1080 logical stage, scaled uniformly to the window (Godot: stretch canvas_items, aspect expand). -->
<div id="viewport">
  <div id="stage" class="paper-grain">
    <!-- Godot DeskMain CanvasLayers, z-order = layer number. -->
    <div class="canvas-layer" id="MapDeskLayer" data-layer="0"></div>
    <div class="canvas-layer" id="HUDLayer" data-layer="10"></div>
    <div class="canvas-layer" id="DrawerLayer" data-layer="20"></div>
    <div class="canvas-layer" id="LedgerCodexLayer" data-layer="30"></div>
    <div class="canvas-layer" id="ModalLayer" data-layer="40"></div>
    <div class="canvas-layer" id="TooltipTutorialLayer" data-layer="50"></div>
    <!-- BootSplash (game/scenes/boot/BootSplash.tscn) -->
    <div id="BootSplash" class="boot-splash">
      <div class="boot-card panel">
        <div class="boot-title">1977 · 大转折</div>
        <div class="boot-sub">Israel Political Simulation — Web 原型（运行 Python 参考模拟内核）</div>
        <pre id="boot-log"></pre>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
