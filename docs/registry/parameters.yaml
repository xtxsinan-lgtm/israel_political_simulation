# 总参数表（唯一事实来源）
# 所有模块规格、事件、模拟脚本和 Godot 实现只能使用这里定义的参数。
# 新增参数必须先改这个文件，并在 docs/registry/CHANGELOG.md 记录。
#
# 字段说明
#   id        英文ID，snake_case，代码中使用
#   zh        中文名，事件文本中使用（与 docs/events/README.md 词典一致）
#   type      axis(−100..100) | stock(0..100) | debt(只增，主动偿还才减) | derived(由公式算出，不能直接写)
#             | currency(可消耗) | hidden(玩家不可直接见) | count(计数) | money | percent | seats
#   scope     national | party | bloc | group | arab_group | power | arab_state | pal_faction | region | character | promise | axis | country
#   range     [min, max]
#   tick      结算周期：daily | weekly | monthly | quarterly | yearly | event(只由事件/行动改变)
#   owner     主写模块（其他模块只能通过“效果”请求修改，见 contracts.md）
#   visible   true | false | fuzzy（通过情报/顾问以模糊措辞显示）
#   era       [起始年, 结束年]，null 表示全时代
#   drift     无外力时每个结算周期的回归方式（见 M02 规格）

modules:
  M01: 核心循环与结算顺序
  M02: 数值模型与矛盾联动
  M03: 议会、选举与组阁
  M04: 党内政治、承诺与立场走廊
  M05: 行动系统与政治资本经济
  M06: 人物与AI内阁
  M07: 外部世界与外交
  M08: 巴勒斯坦政治
  M09: 军事、安全与情报
  M10: 经济与预算
  M11: 地图与区域
  M12: 事件引擎
  M13: 独裁路线
  M14: 剧本、结局与历史评价
  M15: 界面与信息呈现

